name: Add stair parquet project

on:
  push:
    paths:
      - 'scripts/add_scara_parchet.py'
      - '.github/workflows/add-scara-parchet.yml'

permissions:
  contents: write

jobs:
  update-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/add_scara_parchet.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lucrari/index.html
          git diff --cached --quiet || git commit -m "Adaugă proiect scară îmbrăcată cu parchet"
          git push
