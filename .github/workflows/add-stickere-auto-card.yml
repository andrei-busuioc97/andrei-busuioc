name: Add Stickere Auto card

on:
  push:
    paths:
      - '.github/workflows/add-stickere-auto-card.yml'
      - 'scripts/add_stickere_auto.py'

permissions:
  contents: write

jobs:
  update-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/add_stickere_auto.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Add Stickere Auto category to homepage"
          git push
