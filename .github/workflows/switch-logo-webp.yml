name: Switch display logo to WebP

on:
  push:
    paths:
      - '.github/workflows/switch-logo-webp.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update display logo references
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          replacements = [
              ('src="logo-faurit.png"', 'src="logo-faurit.webp"'),
              ('src="../logo-faurit.png"', 'src="../logo-faurit.webp"'),
              ('src="/logo-faurit.png"', 'src="/logo-faurit.webp"'),
              ('background:url("logo-faurit.png")', 'background:url("logo-faurit.webp")'),
              ('background:url("../logo-faurit.png")', 'background:url("../logo-faurit.webp")'),
          ]
          changed=[]
          for p in Path('.').rglob('*.html'):
              text=p.read_text(encoding='utf-8')
              old=text
              for a,b in replacements:
                  text=text.replace(a,b)
              if text!=old:
                  p.write_text(text,encoding='utf-8')
                  changed.append(str(p))
          print('Updated:', *changed, sep='\n- ')
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Use optimized WebP logo across site pages"
            git push origin HEAD:main
          fi
