<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagina nu a fost găsită | Făurit de Busuioc</title>
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#080d12">
  <link rel="icon" type="image/png" href="/favicon.png">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 20%,rgba(0,214,143,.12),transparent 30%),#080d12;color:#fff;font-family:Arial,Helvetica,sans-serif;text-align:center}
    .box{width:min(680px,100%);padding:48px 28px;border:1px solid rgba(255,255,255,.08);border-radius:24px;background:#111b25;box-shadow:0 25px 70px rgba(0,0,0,.42)}
    img{width:min(260px,70%);height:auto;margin:0 auto 26px}
    .code{color:#00d68f;font-weight:900;letter-spacing:3px;font-size:14px;margin-bottom:12px}
    h1{font-size:clamp(34px,7vw,58px);line-height:1.05;margin-bottom:16px}
    p{color:#aab5c3;font-size:17px;line-height:1.65;max-width:540px;margin:0 auto 28px}
    a{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:13px 24px;border-radius:11px;background:#00d68f;color:#03110c;text-decoration:none;font-weight:800;transition:.25s}
    a:hover{transform:translateY(-2px);background:#14eba1}
  </style>
</head>
<body>
  <main class="box">
    <img src="/logo-faurit.png" alt="Făurit de Busuioc">
    <div class="code">EROARE 404</div>
    <h1>Pagina nu a fost găsită</h1>
    <p>Adresa accesată nu există sau pagina a fost mutată. Revino la pagina principală și continuă de acolo.</p>
    <a href="/">Înapoi la Acasă</a>
  </main>
</body>
</html>
